<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Helmi Hakimudin — Full-Stack Software Engineer</title>
    <meta
      name="description"
      content="Personal portfolio of Helmi Hakimudin, a Full-Stack Software Engineer in Jakarta specializing in Laravel, Node.js, React, and real-time enterprise web systems."
    />
    <meta property="og:title" content="Helmi Hakimudin — Full-Stack Software Engineer" />
    <meta
      property="og:description"
      content="Interactive portfolio showcasing Helmi Hakimudin's web development projects, work experience, certifications, and technical skills."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('portfolio_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-indigo-600 selection:text-white dark:bg-[#0B1120] dark:text-slate-100 dark:selection:bg-indigo-500">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
